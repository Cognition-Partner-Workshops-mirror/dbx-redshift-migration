bundle:
  name: dbx-redshift-migration

variables:
  catalog:
    description: Target catalog for migration outputs
    default: demo_redshift
  warehouse_id:
    description: SQL warehouse for validation / SQL tasks.
    # No default — set with `databricks bundle deploy --var warehouse_id=<id>`
    # or env BUNDLE_VAR_warehouse_id.

include:
  - orchestration/nightly.job.yml
  - dashboards/consumer_cutover.dashboard.yml

targets:
  dev:
    default: true
    mode: development
    resources:
      jobs:
        nightly_mart_refresh:
          schedule:
            pause_status: UNPAUSED
    workspace:
      root_path: ~/.bundle/${bundle.name}/migration-run-2/${bundle.target}
    variables:
      catalog: demo_redshift
  prod:
    mode: production
    variables:
      catalog: mig_redshift
