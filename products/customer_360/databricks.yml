bundle:
  name: customer-360

workspace:
  host: https://dbc-c22a0245-3975.cloud.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/customer-360

variables:
  warehouse_id:
    default: 6dc4b80538621b7b
  genie_space_id:
    description: Account Manager Assistant ID, resolved by make app.
    default: ""

targets:
  demo:
    default: true

resources:
  apps:
    customer_lookup:
      name: customer-lookup
      description: Customer lookup and certified portfolio Q&A for account managers.
      source_code_path: ./app
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: account-manager-assistant
          genie_space:
            name: Account Manager Assistant
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
      permissions:
        - group_name: users
          level: CAN_USE
  dashboards:
    customer_health:
      display_name: Customer Health & Revenue
      file_path: ./dashboard/customer-health.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: demo_redshift
      dataset_schema: customer_360
      embed_credentials: true
      permissions:
        - group_name: users
          level: CAN_READ
  jobs:
    build:
      name: Customer 360 - Build certified data
      max_concurrent_runs: 1
      tasks:
        - task_key: schema
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/00_schema.sql
        - task_key: tables
          depends_on:
            - task_key: schema
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/01_tables.sql
        - task_key: metrics
          depends_on:
            - task_key: tables
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ./sql/02_metrics.sql
